name: PHP security checks
on:
  pull_request:
  push:
    branches:
      - main
      - fix/atomic-login-rate-limits
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none
      - name: Lint PHP source files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test Fast Gate v2 token and SQLite fail-closed core
        run: php tests/security-fast-gate-core-test.php
      - name: Test Fast Gate bridge handoff, revocation and Range contract
        run: php tests/fast-gate-bridge-contract-test.php
      - name: Test Fast Gate v2 automatic PHP-key provisioning
        run: php tests/security-fast-gate-provision-test.php
      - name: Test Fast Gate Remember Me stale/missing credential handling
        run: php tests/security-fast-gate-remember-test.php
      - name: Lint admin JavaScript
        run: node --check admin/esp-admin.js
      - name: Test login attempt reservation behavior
        run: php tests/security-rate-limit-test.php
      - name: Test InnoDB and rate limit schema validation
        run: php tests/security-schema-test.php
      - name: Test missing migration marker compatibility
        run: php tests/security-migration-marker-test.php
      - name: Test WordPress media file resolver
        run: php tests/security-media-file-resolver-test.php
      - name: Test AVIF media protection and rewrite coverage
        run: php tests/security-avif-test.php
      - name: Test HEAD-only PHP media delivery
        run: php tests/security-head-delivery-test.php
      - name: Test authenticated media HTTP cache policy
        run: php tests/security-media-cache-policy-test.php
      - name: Test fail-closed rewrite replacement
        run: php tests/security-rewrite-failclosed-test.php
      - name: Test failure boot and REST gate
        run: php tests/security-protection-state-test.php
      - name: Test first activation dependency bootstrap
        run: php tests/security-activation-bootstrap-test.php
      - name: Test failed activation media Rewrite cleanup
        run: php tests/security-activation-failure-test.php
      - name: Test safe media ON/OFF settings transitions
        run: php tests/security-media-settings-transition-test.php
      - name: Test LiteSpeed key rotation preserves protected-path passwords
        run: php tests/security-litespeed-password-test.php
      - name: Test safe uninstall Rewrite cleanup
        run: php tests/security-uninstall-rewrite-test.php
      - name: Test failure of authorization cache rebuilds
        run: php tests/security-cache-failclosed-test.php
      - name: Test generation-tagged caches
        run: php tests/security-authorization-generation-test.php
      - name: Test normal empty protection settings
        run: php tests/security-zero-protected-paths-test.php
      - name: Test protected path index freshness
        run: php tests/security-path-matcher-generation-test.php
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: esp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pcntl
          coverage: none
      - name: Exercise concurrent attempts against InnoDB
        env:
          ESP_TEST_DB_HOST: 127.0.0.1
          ESP_TEST_DB_USER: root
          ESP_TEST_DB_PASSWORD: test-password
          ESP_TEST_DB_NAME: esp_test
        run: php tests/security-mysql-integration.php
      - name: Verify Remember Me refresh race against real MySQL
        env:
          ESP_TEST_DB_HOST: 127.0.0.1
          ESP_TEST_DB_USER: root
          ESP_TEST_DB_PASSWORD: test-password
          ESP_TEST_DB_NAME: esp_test
        run: php tests/security-fast-gate-remember-mysql.php
      - name: Exercise dedicated media index and safety states in MySQL
        env:
          ESP_TEST_DB_HOST: 127.0.0.1
          ESP_TEST_DB_USER: root
          ESP_TEST_DB_PASSWORD: test-password
          ESP_TEST_DB_NAME: esp_test
        run: php tests/security-media-index-mysql.php
      - name: Verify migration lock ownership across MySQL sessions
        env:
          ESP_TEST_DB_HOST: 127.0.0.1
          ESP_TEST_DB_USER: root
          ESP_TEST_DB_PASSWORD: test-password
          ESP_TEST_DB_NAME: esp_test
        run: php tests/security-verification-mysql-lock-test.php
  wordpress-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: esp_wp44
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Real 0.7.38 / 0.7.39 / 0.7.40 historical sources for upgrade fixtures.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Real WordPress schema, release and upgrader fixtures
        run: bash .github/scripts/test-wordpress-updates.sh
  fast-gate-real-wordpress:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: esp_fast_gate_wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sqlite3
          coverage: none
      - name: Exercise Fast Gate v2 with REAL WordPress, MySQL and SQLite
        env:
          ESP_ALLOW_DISPOSABLE_DB: "1"
        run: bash .github/scripts/test-fast-gate-wordpress.sh
  fast-gate-upgrade-lifecycle:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest is now 26.04.
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: esp_fg_lifecycle
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, sqlite3
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium for real admin UI test
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Upgrade released ZIP, verify lifecycle, Apache HTTP and Chromium admin UI
        env:
          ESP_ALLOW_DISPOSABLE_DB: "1"
        run: bash .github/scripts/test-fast-gate-lifecycle.sh
      - name: Archive Fast Gate lifecycle timings and HTTP comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp-fast-gate-v2-lifecycle-actual
          path: ${{ runner.temp }}/esp-fast-gate-lifecycle/*
          if-no-files-found: warn
          retention-days: 14
  wordpress-apache-http:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: esp_wp31
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end Apache/WordPress media access, UI and performance
        env:
          ESP_ALLOW_DISPOSABLE_DB: "1"
        run: bash .github/scripts/test-wordpress-apache-http.sh
      - name: Upload real WordPress media-index E2E measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp63-real-wordpress-ui-media-db-e2e
          path: ${{ runner.temp }}/esp-media-index-e2e/*.log
          if-no-files-found: warn
          retention-days: 14
  package-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable WordPress ZIP
        run: |
          python3 tools/build-release.py
          python3 tools/test-release-package.py
          (cd dist && sha256sum -c *.sha256)
          if python3 tools/build-release.py --tag v999.0.0; then
            echo 'Mismatched tag accepted' >&2
            exit 1
          fi
      - name: Upload WordPress installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: easy-slug-protect-wordpress-zip
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
